name: carebridge_driver
description: "CareBridge driver — the app a driver runs a shift from."
publish_to: 'none'
version: 0.1.0+1

# A member of the Dart workspace declared in the root pubspec, so the driver
# app, the family app, the console and the generated client resolve once and
# cannot end up on different versions of `http` disagreeing about what a
# response is.
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  go_router: ^17.3.0
  intl: ^0.20.3
  http: ^1.6.0
  url_launcher: ^6.3.2

  # Location, and on Android the foreground service that keeps it running with
  # the screen off. A ride is thirty minutes of driving with the phone in a
  # cradle and the app behind a navigation app; without the foreground service
  # Android stops delivering positions within minutes and the family's map
  # quietly freezes.
  geolocator: ^14.0.2

  # The battery level the cadence rule backs off on. A named risk in
  # FOUNDATION rather than a nicety: a driver whose phone dies at four o'clock
  # is a driver who stops using the app.
  battery_plus: ^7.0.1

  # Tokens live in the Keychain / EncryptedSharedPreferences. A driver's phone
  # is the device most likely to be lost, left in a vehicle, or handed to
  # somebody else at the end of a shift.
  flutter_secure_storage: ^11.0.0

  # Wire models only. The transport comes from carebridge_client, which owns
  # refresh — see `ApiTransport`.
  carebridge_api:
    path: ../../packages/dart/carebridge_api

  carebridge_client:
    path: ../../packages/dart/carebridge_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
