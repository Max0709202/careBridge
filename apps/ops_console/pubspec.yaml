name: carebridge_ops_console
description: "CareBridge ops console — the dispatch surface a transport operator works the queue from."
publish_to: 'none'
version: 0.1.0+1

# A member of the Dart workspace declared in the root pubspec, so the console,
# the family app and the generated client resolve once and cannot end up on
# different versions of `http` disagreeing about what a response is.
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  go_router: ^17.3.0
  intl: ^0.20.3
  http: ^1.6.0
  # Same reasoning as the family app: a token belongs in encrypted storage, not
  # in a plaintext localStorage entry that every script on the origin can read.
  flutter_secure_storage: ^11.0.0

  # Models only, never the transport — see `OpsApi`. The console owns a single
  # HTTP client because it owns refresh, and two clients each retrying a 401
  # will eventually both present the same rotated token, at which point reuse
  # detection correctly revokes the session and signs the dispatcher out
  # mid-shift.
  carebridge_api:
    path: ../../packages/dart/carebridge_api

  # Failure types, secure token storage and the error mapping. Shared with the
  # family app rather than reimplemented: the API answers "no such record" and
  # "not yours" identically on purpose, and a second mapping of that envelope
  # is where the ambiguity would get quietly undone.
  carebridge_client:
    path: ../../packages/dart/carebridge_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled rather than fetched from fonts.gstatic.com, for the three reasons
  # set out in the root pubspec. The one that matters most here is the third:
  # CanvasKit has no system font to fall back on, so a blocked download renders
  # a dispatcher's queue as a screen of empty boxes — and a dispatcher cannot
  # wait for someone to explain that the network is at fault.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
