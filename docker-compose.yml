# The whole product, locally.
#
#   cp .env.example .env && docker compose up --build
#   → http://localhost:8080   the family app
#   → http://localhost:8025   Mailpit — every email the API sends, caught here
#   → http://localhost:9001   MinIO console
#
# Identical Postgres, Redis, mail and object storage on every machine and in
# CI, so "works locally" means something. The API image built here is the
# artefact that would be deployed — the same container, not a re-built
# approximation of it.

name: carebridge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carebridge-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-carebridge}
    volumes:
      - carebridge-db:/var/lib/postgresql/data
    ports:
      # Exposed so you can attach psql or a GUI while developing. Bound to
      # loopback only — a database on 0.0.0.0 is one misconfigured firewall
      # away from being everybody's database.
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-carebridge} -d ${POSTGRES_DB:-carebridge}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly yes` so a restart does not silently drop the delayed-job set.
    # Redis is still a cache and never the source of truth (FOUNDATION §4) —
    # this only spares a developer the confusion of reminders vanishing on
    # `docker compose restart`.
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    volumes:
      - carebridge-redis:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-56379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-carebridge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-carebridge-local-dev}
    volumes:
      - carebridge-minio:/data
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      # Root context: the API resolves through the pnpm workspace, so its
      # lockfile and shared config packages live above apps/api.
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '3000'
      DATABASE_URL: postgresql://${POSTGRES_USER:-carebridge}:${POSTGRES_PASSWORD:-carebridge-local-dev}@db:5432/${POSTGRES_DB:-carebridge}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — copy .env.example to .env}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      # The browser talks to nginx, which proxies /api to this service, so
      # every request is same-origin and CORS never enters the picture. The
      # allowlist below is for `flutter run` against the host.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_ON_START: ${SEED_ON_START:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      MAIL_DRIVER: smtp
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: '1025'
      MAIL_FROM: ${MAIL_FROM:-CareBridge <no-reply@carebridge.local>}
      PUSH_DRIVER: ${PUSH_DRIVER:-log}
      MAPS_DRIVER: ${MAPS_DRIVER:-deterministic}
      # Moves no money and scripts its outcomes from the card's last four
      # digits, so the decline and dunning paths are reachable in the demo.
      PAYMENTS_DRIVER: ${PAYMENTS_DRIVER:-local}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-local-webhook-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'

  # The dispatch console, on its own origin.
  #
  # A separate service rather than a path on `web`, for the reason the image is
  # separate: the two are different products for different people, and one
  # origin would mean every family downloads the dispatch bundle and one XSS in
  # either surface reaches both. A deployment can put this port behind an
  # office allowlist without touching the app a patient's daughter opens on a
  # train.
  ops:
    build:
      context: .
      dockerfile: Dockerfile.ops
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${OPS_PORT:-8081}:80'

volumes:
  carebridge-db:
  carebridge-redis:
  carebridge-minio:
