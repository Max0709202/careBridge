server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter's service worker and the bundle it manages are versioned by
    # filename; index.html and the manifest are not, so they must never be
    # cached or a deploy leaves browsers loading an old bundle indefinitely.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Same-origin proxy to the API container. This is what lets the client use
    # a relative base URL and never learn the API's hostname.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Client-side routing: any unmatched path is a GoRouter location, not a
    # missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
