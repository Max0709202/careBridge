# HSTS only once there is TLS in front of this. nginx omits an `add_header`
# whose value is empty, so this map is what makes one header line correct in
# both the local stack and production.
map $scheme $carebridge_hsts {
    default        "";
    https          "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is ~3 MB of JavaScript before compression and the whole app is
    # unusable until it has arrived. The people this product is for are not
    # reliably on fibre.
    #
    # Only static text types: the API is proxied through this server too, and
    # compressing a response that reflects request content is how BREACH works.
    # `gzip_proxied off` (the default) already excludes proxied responses, and
    # this list is the belt to that brace.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm application/manifest+json;

    # Flutter's service worker and the bundle it manages are versioned by
    # filename; index.html and the manifest are not, so they must never be
    # cached or a deploy leaves browsers loading an old bundle indefinitely.
    location = /index.html {
        include /etc/nginx/carebridge/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        include /etc/nginx/carebridge/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # CanvasKit is instantiated with WebAssembly.instantiateStreaming, which
    # rejects anything not served as application/wasm: the page loads, runs and
    # paints nothing. nginx has mapped the extension since 1.21, so on the
    # pinned image `default_type` here never fires — it is the safety net for
    # an older nginx or a trimmed mime.types, and it is a `default_type`
    # precisely because a `types` block would *replace* the inherited map
    # rather than extend it and serve every other file as a download.
    #
    # Regex, so it also covers the bundle's .wasm wherever the build puts it;
    # cached like the rest of the versioned output.
    location ~ \.wasm$ {
        include /etc/nginx/carebridge/security-headers.conf;
        default_type application/wasm;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        include /etc/nginx/carebridge/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Same-origin proxy to the API container. This is what lets the client use
    # a relative base URL and never learn the API's hostname.
    location /api/ {
        # Docker's embedded DNS, resolved per request. nginx resolves a literal
        # hostname in proxy_pass once at config load and caches the address for
        # the life of the process, so recreating the api container leaves this
        # one proxying a dead IP until nginx itself is restarted. Passing the
        # upstream through a variable makes nginx honour the TTL instead.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Client-side routing: any unmatched path is a GoRouter location, not a
    # missing file.
    location / {
        include /etc/nginx/carebridge/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
