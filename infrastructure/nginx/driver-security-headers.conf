# Response headers for the driver web app's origin.
#
# The family app's security-headers.conf, with the three differences a driver
# page needs and nothing else. It replaces that file in the driver image (same
# path, so carebridge.conf is shared unchanged).
#
#   Permissions-Policy geolocation=(self) — the whole point of the page is
#       reporting the vehicle's position during a ride. Still (self) only, so
#       an injected frame cannot ask.
#   Permissions-Policy screen-wake-lock=(self) — keeping the screen on is the
#       closest a browser gets to the Android foreground service; a locked
#       phone stops delivering positions.
#   connect-src 'self' __UPLOAD_ORIGIN__ — document photos go straight to
#       object storage on a pre-signed URL, which in production is not this
#       origin. The Dockerfile substitutes the one storage origin at build time
#       (empty when storage is same-origin), never a wildcard.
#
# No 'wasm-unsafe-eval': this bundle is plain JavaScript.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' __UPLOAD_ORIGIN__; worker-src 'self'; manifest-src 'self'" always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;

# A ride id in a path must not travel to wherever a driver clicks through to.
add_header Referrer-Policy "no-referrer" always;

add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(), screen-wake-lock=(self), usb=()" always;

add_header Strict-Transport-Security $carebridge_hsts always;
