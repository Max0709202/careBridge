# Response headers for everything served from the app origin.
#
# Included rather than set once at server level because nginx's `add_header`
# inheritance is all-or-nothing: a location that sets a header of its own stops
# inheriting the ones above it. Three locations here set Cache-Control, so a
# server-level block would silently apply to some responses and not others —
# which is the failure mode where a header is present in the one place you
# check it and absent everywhere else.
#
# Not included in `location /api/`: helmet owns the API's headers, and two
# sources for one header is how they end up contradicting each other.

# Content Security Policy.
#
# The app is entirely same-origin: the API is proxied under /api, CanvasKit is
# built into the image (`--no-web-resources-cdn`) rather than fetched from
# gstatic, and fonts are bundled assets. So everything is 'self' and there is
# no vendor to add — `connect-src 'self'` alone means a script injected into
# this page has nowhere to send what it reads.
#
# The two loosenings are the web engine's, not ours:
#   'wasm-unsafe-eval' — CanvasKit and skwasm are WebAssembly; without it the
#       engine cannot instantiate and the page is blank.
#   style-src 'unsafe-inline' — Flutter writes its own <style> rules at
#       runtime for the view host and text measurement.
# The build uses `--csp`, so dart2js emits no `eval` and 'unsafe-eval' is not
# needed — the flag and this header have to be changed together.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

# Clickjacking. frame-ancestors above is the modern control and covers browsers
# that support CSP; this is for the ones that do not.
add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;

# A patient id, a ride id or an invitation token in a path must not travel to
# whatever a user clicks through to.
add_header Referrer-Policy "no-referrer" always;

# Nothing here uses a camera, a microphone or a payment handler, and location
# is the driver app's problem, not this one's. Denying them outright means an
# injected script cannot prompt for them either.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Empty over plain HTTP, so the local stack on :8080 does not pin `localhost`
# — HSTS ignores the port, and a pin there would break every other HTTP
# service a developer runs on this machine. Browsers are required to ignore
# the header on an insecure response anyway; not sending it is the belt.
add_header Strict-Transport-Security $carebridge_hsts always;
