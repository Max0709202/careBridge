name: carebridge_family
description: "CareBridge — coordinate an older relative's medical appointments and transportation, and know they arrived safely."
publish_to: 'none'
version: 0.1.0+1

# The Dart half of the monorepo.
#
# `workspace` is Dart's own mechanism, and melos 8 builds on it rather than
# replacing it — one resolution across the app and the generated client, so the
# two cannot end up on different versions of `http` and disagree about what a
# response is.
workspace:
  - packages/dart/carebridge_api

environment:
  # Widened from ^3.12.2 so the app builds on the newest published Flutter
  # container image (3.44.0 / Dart 3.12.0) as well as on a local 3.44.x SDK.
  # Nothing here needs a 3.12.2 language feature, and pinning a patch the
  # published images do not carry means the Docker build cannot run at all.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.1
  go_router: ^17.3.0
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  http: ^1.6.0
  # Tokens live in the Keychain / EncryptedSharedPreferences, never in shared
  # preferences — see docs/FOUNDATION.md §9. On web this is AES-encrypted
  # storage rather than a plaintext localStorage entry.
  flutter_secure_storage: ^11.0.0

  # The generated API client, from packages/contracts/openapi.json.
  #
  # The app takes its **models** from here — the wire types stay in step with
  # the server by construction, which is the whole point of generating them
  # (FOUNDATION T7).
  #
  # It deliberately does **not** take the transport. `CareApi` owns the single
  # HTTP client, because it owns refresh: two clients each refreshing on a 401
  # will eventually both present the same rotated token, and reuse detection —
  # correctly — revokes the whole family and signs the user out. One transport
  # is the only safe number.
  carebridge_api:
    path: packages/dart/carebridge_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # From melos 7 the tool is a dev dependency of the workspace root rather than
  # a globally activated binary — so the version everyone runs is the version
  # in the lockfile, and `dart run melos` is the only correct invocation.
  melos: ^8.2.2

flutter:
  uses-material-design: true

  # Roboto is bundled rather than left to the web engine, which otherwise
  # fetches it from fonts.gstatic.com on first paint. Three consequences, in
  # ascending order of how much they matter:
  #
  #   1. The app makes no third-party request, so the Content-Security-Policy
  #      in infrastructure/nginx/security-headers.conf can be 'self' throughout
  #      — an injected script has nowhere to send what it reads.
  #   2. Nobody outside this deployment learns that a given IP opened a
  #      medical-appointment app, or when. That request is unauthenticated and
  #      uncacheable-by-us, and it is made before the user has consented to
  #      anything.
  #   3. CanvasKit has no system fonts to fall back on. If that download fails
  #      — offline, blocked, or someone else's outage — the app renders every
  #      screen with no text at all. Verified: it renders a blank sign-in form.
  #
  # 400/500/700 are the weights the theme asks for; w600 resolves to the
  # nearest of them. Licence alongside the files.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# ─── melos ────────────────────────────────────────────────────────────────────
#
# Scripts over the Dart packages. `make` is the single entry point that runs
# both halves of the monorepo; this is the half pnpm knows nothing about.
melos:
  name: carebridge

  # Melos takes its package list from the `workspace:` key above, and a pub
  # workspace root is never a member of itself. This root is both the
  # workspace root *and* the family app, so melos covers the generated client
  # and the Makefile drives the app directly with `flutter`.
  #
  # FOUNDATION §8 puts the app at apps/mobile_family/, which would make the
  # root a pure workspace root and let melos cover everything. That relocation
  # is a mechanical move of six platform directories, the web Dockerfile and
  # the CI paths — worth doing, and worth doing on its own rather than folded
  # into a feature change.

  scripts:
    analyze:
      description: Static analysis across every Dart package.
      run: dart run melos exec -- dart analyze

    format:
      description: Formatting check. Fails rather than rewrites, so CI is honest.
      run: dart run melos exec -- dart format --output=none --set-exit-if-changed .

    test:
      description: Unit and widget tests for every package that has them.
      run: dart run melos exec --dir-exists=test -- flutter test

    api:generate:
      description: >-
        Regenerate carebridge_api from packages/contracts/openapi.json, then
        prove the output compiles. Regenerating alone is not enough: a
        generator bug that emits a missing type produces a perfectly stable
        diff and a client nobody can build.
      run: |
        node scripts/generate-dart-client.mjs
        dart format packages/dart/carebridge_api
        dart run melos exec --scope=carebridge_api -- dart analyze
